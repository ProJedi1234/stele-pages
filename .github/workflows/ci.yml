# Build and test on every push to main and every pull request.
#
# Runs inside the official Swift container for Ubuntu 24.04 (noble) rather than on the
# runner's own OS: Swift toolchains are built against noble's libraries (libxml2.so.2,
# ICU 74), and newer Ubuntu images ship incompatible sonames. The container pins the
# whole userland to what the toolchain expects.
#
# Most of the suite is pure logic (slug rules, wordlist invariants, DATABASE_URL parsing)
# or HTTP-level tests against an in-memory store, and needs nothing but the toolchain. The
# postgres service below exists for the one suite that cannot be faked: the migration
# runner's claims are claims about Postgres. That suite is gated on
# STELE_TEST_DATABASE_URL, so it runs here and a plain local `swift test` stays hermetic.

name: CI

# Only run when something the build actually consumes changes. The workflow file
# itself is on the list so edits to the CI still get exercised by the CI. If this
# check ever becomes required by branch protection, drop the filters — a required
# check that is skipped by a path filter leaves the PR blocked forever.
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/ci.yml'

# A force-push or rapid follow-up commit obsoletes the running build; finish only the
# newest one per ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    # The job runs in a container on the services network, so Postgres is reachable at
    # its service alias rather than on a mapped localhost port.
    services:
      postgres:
        image: postgres:17-alpine  # same pin as docker-compose.yml
        env:
          POSTGRES_USER: stele
          POSTGRES_PASSWORD: stele_test_password
          # The maintenance database. The suite creates and drops a throwaway schema per
          # test and never wants a database of its own to be the one it is dropping in.
          POSTGRES_DB: postgres
        # Without a healthcheck the job starts querying a Postgres that is still
        # initialising, and the first test fails on a refused connection.
        options: >-
          --health-cmd "pg_isready -U stele" --health-interval 2s
          --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7

      # The container runs as root while the checkout is owned by another uid, so git
      # refuses to touch the repo until it is marked safe — and SwiftPM shells out to
      # git during dependency resolution.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Keyed on Package.resolved so dependency bumps rebuild from scratch while
      # source-only changes reuse the compiled dependency graph.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-

      # Split from the test run so a compile failure is distinguishable from a failing
      # assertion in the job summary.
      - name: Build
        run: swift build --build-tests

      # Only this step gets the variable: it is what switches the Postgres suite on, and
      # scoping it here keeps the build step honest about needing no database.
      - name: Test
        run: swift test --skip-build
        env:
          STELE_TEST_DATABASE_URL: postgres://stele:stele_test_password@postgres:5432/postgres
